[package]
name = "rubik"
version = "0.1.0"
edition = "2024"

[dependencies]

[profile.dev]
# debug : quelles infos de debug générer. Elles coûtent cher à lier, et l'édition
# des liens est refaite à chaque modification, même d'une ligne.
#   true               -> tout : variables, types, inspection dans un débogueur (défaut)
#   "line-tables-only" -> seulement les numéros de ligne : backtraces lisibles,
#                         plus d'inspection des variables, édition des liens plus rapide
#   false              -> rien : le plus rapide, backtraces sans numéros de ligne
debug = "line-tables-only"

# Dépendances optimisées en dev ("*" = toutes les dépendances, pas notre crate).
# Elles ne sont compilées qu'une fois puis mises en cache : notre code reste en
# opt-level 0 (recompilation rapide) mais les dépendances tournent à vitesse normale.
#   0 -> aucune optimisation (défaut)
#   1 -> optimisations de base
#   2 -> bon compromis temps de compilation / vitesse
#   3 -> vitesse maximale, première compilation plus longue
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# strip : quelles informations retirer du binaire final.
#   "none"      -> on garde tout (le plus gros binaire)
#   "debuginfo" -> retire les infos de debug détaillées (défaut en release)
#   true        -> retire aussi les noms de fonctions (= "symbols") : plus petit,
#                  mais une backtrace affichera des adresses au lieu des noms
strip = true

# lto : optimisation de tout le programme au moment de l'édition des liens.
#   false  -> LTO seulement à l'intérieur de chaque crate (défaut)
#   "thin" -> LTO entre crates, compromis rapide
#   true   -> LTO complète (= "fat") : binaire plus petit et plus rapide,
#             mais l'étape `cargo build` est plus longue (non couverte par le cache de cargo-chef)
lto = true

# codegen-units : en combien de morceaux chaque crate est découpé pour compiler en parallèle.
#   16 -> compilation parallèle, rapide (défaut)
#   1  -> le compilateur voit le crate entier : binaire plus petit et plus rapide,
#         compilation plus lente
codegen-units = 1

# panic : ce qui se passe quand le programme panique.
#   "unwind" -> remonte la pile en exécutant les Drop, catch_unwind possible (défaut)
#   "abort"  -> arrêt immédiat : binaire plus petit, mais plus de catch_unwind
#               ni de Drop pendant un panic (change le comportement du programme)
panic = "unwind"

# opt-level : ce que le compilateur cherche à optimiser.
#   3   -> vitesse maximale (défaut)
#   "s" -> taille, en gardant une bonne vitesse
#   "z" -> taille maximale, au prix de la vitesse
#   C'est le seul vrai compromis taille/vitesse de ce profil.
opt-level = 3
